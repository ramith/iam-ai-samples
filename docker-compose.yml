# Compose topology for the Identity-First AI Agent Governance POC (v4).
#
# Six services (local IdP + app services):
#   - wso2is        : WSO2 Identity Server (official wso2/wso2is image from Docker Hub)
#   - orchestrator  : SPA host + chat router + CIBA fan-out + reports proxy
#                     (http://localhost:8090)
#   - hr_agent      : HR specialist; per-agent CIBA → hr_server MCP tools
#   - it_agent      : IT specialist; per-agent CIBA → it_server MCP tools
#   - hr_server     : HR MCP tools + REST (leave, cubicles, reports)
#   - it_server     : IT MCP tools + REST (assets, reports)
#
# The pre-v4 `agent` (5001) and `client` (3001) services were removed in
# Sprint 4 — the SPA is served by the orchestrator now. Reliable bring-up:
#   ./scripts/demo-up.sh            # build (cached) + start + smoke
#   ./scripts/demo-up.sh --clean    # down + no-cache rebuild + start + smoke
#   ./scripts/demo-down.sh          # stop + remove containers

networks:
  demo-net:
    driver: bridge

volumes:
  wso2is_data:

services:
  wso2is:
    build:
      context: ./wso2-is
      dockerfile: Dockerfile
      args:
        # WSO2 IS version (>= 7.3.0). Pulls wso2/wso2is:<version>-alpine from
        # Docker Hub. Override via env: WSO2IS_VERSION=7.4.0 ./start.sh
        WSO2IS_VERSION: ${WSO2IS_VERSION:-7.3.0}
    environment:
      - BOOTSTRAP_ON_START=${WSO2_BOOTSTRAP_ON_START:-true}
      - BOOTSTRAP_WAIT_SECONDS=${WSO2_BOOTSTRAP_WAIT_SECONDS:-300}
      - BOOTSTRAP_SCRIPT=/workspace/scripts/bootstrap-wso2is-entrypoint.sh
      - IS_BASE_URL=https://localhost:9443
      - IS_ADMIN_USER=${IS_ADMIN_USER:-admin}
      - IS_ADMIN_PASS=${IS_ADMIN_PASS:-admin}
      - IS_AGENT_OWNER=${IS_AGENT_OWNER:-admin@carbon.super}
      # NOTE: ENABLE_UAEPASS is NOT passed here — the bootstrap reads it straight
      # from config/master.env (mounted at /workspace/config/master.env), making
      # master.env the single source of truth (no shell/compose env dependency).
    ports:
      - "9443:9443"
      - "9763:9763"
    volumes:
      - ./:/workspace
      - wso2is_data:/opt/wso2is/repository/database
    healthcheck:
      test: ["CMD-SHELL", "test -f /workspace/.bootstrap/wso2is.ready && curl -skf https://localhost:9443/oauth2/jwks >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - demo-net

  # ─── Existing services (unchanged) ─────────────────────────────────────────
  hr_server:
    build:
      context: .
      dockerfile: apps/hr_server/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # BLOCK-D: bind loopback only
    env_file:
      - ./apps/hr_server/.env
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      - WSO2_IS_BASE_URL=${WSO2_IS_BASE_URL:-https://wso2is:9443}
      - AUTH_ISSUER=${AUTH_ISSUER:-https://localhost:9443/oauth2/token}
      - JWKS_URL=${JWKS_URL:-https://wso2is:9443/oauth2/jwks}
      - WSO2_IS_INTROSPECT_URL=${WSO2_IS_INTROSPECT_URL:-https://wso2is:9443/oauth2/introspect}
      - DISABLE_SSL_VERIFY=${DISABLE_SSL_VERIFY:-true}
      - HR_SERVER_HOST=0.0.0.0
      - MCP_ALLOWED_HOSTS="127.0.0.1,localhost,hr_server"
      # Token introspection feature-flagged OFF (denylist-only backstop).
      # NOTE: config.py reads HR_SERVER_INTROSPECT_ENABLED (default "true"),
      # so the var MUST carry the HR_SERVER_ prefix for this OFF flag to apply.
      - HR_SERVER_INTROSPECT_ENABLED=${HR_SERVER_INTROSPECT_ENABLED:-false}
      # Sprint 3 3A.2: shared secret for /internal/events fan-out (BLOCK-B simple).
      # Operator MUST set this in shell or .env (not committed) before `make demo-up`.
      - INTERNAL_REVOKE_SHARED_SECRET=${INTERNAL_REVOKE_SHARED_SECRET:-}
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./apps/hr_server/.env:/app/hr_server/.env
    networks:
      - demo-net
    depends_on:
      wso2is:
        condition: service_healthy

  # NOTE: the Sprint-1 `agent` (port 5001) and `client` (port 3001) services
  # were removed in Sprint 4 — they were a pre-v4 scaffold. The SPA is served
  # by the `orchestrator` at http://localhost:8090; there is no separate
  # client container. (Old containers can be cleared with `docker compose down`.)

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    ports:
      # Container always listens on 8080 internally; host port 8090
      # avoids a conflict with a common SSH-tunnel default. Sprint 1
      # may switch this to 5001 once `agent` service is removed.
      - "8090:8080"
    env_file:
      - ./apps/orchestrator/.env
    environment:
      - ORCHESTRATOR_HOST=0.0.0.0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      - WSO2_IS_BASE_URL=${WSO2_IS_BASE_URL:-https://wso2is:9443}
      - WSO2_IS_ISSUER=${WSO2_IS_ISSUER:-https://localhost:9443/oauth2/token}
      - WSO2_IS_JWKS_URL=${WSO2_IS_JWKS_URL:-https://wso2is:9443/oauth2/jwks}
      - IS_ADMIN_USER=${IS_ADMIN_USER:-admin}
      - IS_ADMIN_PASS=${IS_ADMIN_PASS:-admin}
      - IDP_INSECURE_TLS=${IDP_INSECURE_TLS:-1}
      - AGENT_CARDS_DIR=/app/agent_cards
      # Sprint 3 3A.2: shared secret + fan-out target URLs.
      - INTERNAL_REVOKE_SHARED_SECRET=${INTERNAL_REVOKE_SHARED_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HR_AGENT_URL=http://hr_agent:8001
      - IT_AGENT_URL=http://it_agent:8002
      - HR_SERVER_URL=http://hr_server:8000
      - IT_SERVER_URL=http://it_server:8004
      # 3A.2.2: must be EXACTLY registered as a Callback URL on the
      # orchestrator-mcp-client app in IS Console. WSO2 IS rejects with
      # "Post logout URI does not match" otherwise (live-walk 2026-05-09).
      # Default = orchestrator's port 8090 since the SPA is served from
      # orchestrator/main.py StaticFiles (the legacy `client:3001` container
      # is no longer the SPA host).
      - POST_LOGOUT_REDIRECT_URI=${POST_LOGOUT_REDIRECT_URI:-http://localhost:8090/}
      # NOTE: ENABLE_UAEPASS is NOT passed here — it's rendered into
      # apps/orchestrator/.env from master.env (env_file above), so master.env is
      # the single source of truth for the SPA branding flag.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # POC constraint: single replica only (per milestone-plan §5.3 + R7 determinism).
    # CI asserts this; multi-replica needs sticky sessions + Redis-backed state.
    deploy:
      replicas: 1
    volumes:
      - ./apps/orchestrator/.env:/app/orchestrator/.env
      - ./apps/orchestrator/agent_cards:/app/agent_cards
    depends_on:
      hr_agent:
        condition: service_healthy
      it_agent:
        condition: service_healthy
      wso2is:
        condition: service_healthy
    networks:
      - demo-net

  hr_agent:
    build:
      context: .
      dockerfile: apps/hr_agent/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"  # BLOCK-D: bind loopback only; receiver not on host LAN
    env_file:
      - ./apps/hr_agent/.env
    environment:
      - HR_AGENT_HOST=0.0.0.0
      - WSO2_IS_BASE_URL=${WSO2_IS_BASE_URL:-https://wso2is:9443}
      - WSO2_IS_ISSUER=${WSO2_IS_ISSUER:-https://localhost:9443/oauth2/token}
      - WSO2_IS_JWKS_URL=${WSO2_IS_JWKS_URL:-https://wso2is:9443/oauth2/jwks}
      - IDP_INSECURE_TLS=${IDP_INSECURE_TLS:-1}
      - HR_MCP_SERVER_URL=http://hr_server:8000
      # hr->it onboarding coordination peer endpoint (non-CIBA).
      - IT_AGENT_PEER_URL=http://it_agent:8002
      # Sprint 3 3A.2.
      - INTERNAL_REVOKE_SHARED_SECRET=${INTERNAL_REVOKE_SHARED_SECRET:-}
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./apps/hr_agent/.env:/app/hr_agent/.env
    depends_on:
      hr_server:
        condition: service_healthy
      wso2is:
        condition: service_healthy
    networks:
      - demo-net

  it_agent:
    build:
      context: .
      dockerfile: apps/it_agent/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"  # BLOCK-D: bind loopback only
    env_file:
      - ./apps/it_agent/.env
    environment:
      - IT_AGENT_HOST=0.0.0.0
      - WSO2_IS_BASE_URL=${WSO2_IS_BASE_URL:-https://wso2is:9443}
      - WSO2_IS_ISSUER=${WSO2_IS_ISSUER:-https://localhost:9443/oauth2/token}
      - WSO2_IS_JWKS_URL=${WSO2_IS_JWKS_URL:-https://wso2is:9443/oauth2/jwks}
      - IDP_INSECURE_TLS=${IDP_INSECURE_TLS:-1}
      - IT_MCP_SERVER_URL=http://it_server:8004
      # Sprint 3 3A.2.
      - INTERNAL_REVOKE_SHARED_SECRET=${INTERNAL_REVOKE_SHARED_SECRET:-}
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./apps/it_agent/.env:/app/it_agent/.env
    depends_on:
      it_server:
        condition: service_healthy
      wso2is:
        condition: service_healthy
    networks:
      - demo-net

  it_server:
    build:
      context: .
      dockerfile: apps/it_server/Dockerfile
    ports:
      - "127.0.0.1:8004:8004"  # BLOCK-D: bind loopback only
    env_file:
      - ./apps/it_server/.env
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      - WSO2_IS_BASE_URL=${WSO2_IS_BASE_URL:-https://wso2is:9443}
      - AUTH_ISSUER=${AUTH_ISSUER:-https://localhost:9443/oauth2/token}
      - JWKS_URL=${JWKS_URL:-https://wso2is:9443/oauth2/jwks}
      - WSO2_IS_INTROSPECT_URL=${WSO2_IS_INTROSPECT_URL:-https://wso2is:9443/oauth2/introspect}
      - DISABLE_SSL_VERIFY=${DISABLE_SSL_VERIFY:-true}
      - IT_SERVER_HOST=0.0.0.0
      - MCP_ALLOWED_HOSTS="127.0.0.1,localhost,it_server"
      # Token introspection feature-flagged OFF (denylist-only backstop).
      # config.py reads IT_SERVER_INTROSPECT_ENABLED (default "true").
      - IT_SERVER_INTROSPECT_ENABLED=${IT_SERVER_INTROSPECT_ENABLED:-false}
      # Sprint 3 3A.2.
      - INTERNAL_REVOKE_SHARED_SECRET=${INTERNAL_REVOKE_SHARED_SECRET:-}
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./apps/it_server/.env:/app/it_server/.env
    networks:
      - demo-net
    depends_on:
      wso2is:
        condition: service_healthy


