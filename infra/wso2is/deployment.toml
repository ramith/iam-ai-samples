# WSO2 IS 7.3.0 — fully-local docker config (see docs/architecture/fully-local-setup-plan.md).
# Mounted read-only at repository/conf/deployment.toml via the compose volume.
#
# Derived from the released image's DEFAULT deployment.toml; the ONLY changes vs
# default are: (1) [server] hostname localhost -> wso2is (D5), and (2) the three
# datasources (identity_db, shared_db, AgentIdentity) switched from embedded H2
# to the MySQL container. Everything else (keystore p12, truststore, recovery)
# is verbatim from the default so no required config is dropped.
#
# NOTE: JDBC URL '&' is written as '&amp;' — WSO2 templates this value into
# master-datasources.xml (XML), where a bare '&' is an illegal entity start.

[server]
hostname = "wso2is"
node_ip = "127.0.0.1"
base_path = "https://$ref{server.hostname}:${carbon.management.port}"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[user_store]
type = "database_unique_id"

[database.identity_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2_IDENTITY_DB?useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "wso2carbon"
password = "wso2carbon"

[database.identity_db.pool_options]
maxActive = 100
maxWait = 10000
validationQuery = "SELECT 1"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2_SHARED_DB?useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "wso2carbon"
password = "wso2carbon"

[database.shared_db.pool_options]
maxActive = 100
maxWait = 10000
validationQuery = "SELECT 1"

# Dedicated datasource for the Agent identity userstore (default ships as H2
# WSO2AGENTIDENTITY_DB). Schema = dbscripts/identity/agent/mysql.sql, loaded
# into WSO2_AGENT_DB by the MySQL initdb (infra/mysql/initdb/20-agent.sql).
[datasource.AgentIdentity]
id = "AgentIdentity"
url = "jdbc:mysql://mysql:3306/WSO2_AGENT_DB?useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[keystore.primary]
file_name = "wso2carbon.p12"
password = "wso2carbon"
type = "PKCS12"

[truststore]
file_name = "client-truststore.p12"
password = "wso2carbon"
type = "PKCS12"

[account_recovery.endpoint.auth]
hash = "66cd9688a2ae068244ea01e70f0e230f5623b7fa4cdecb65070a09ec06452262"

[identity.auth_framework.endpoint]
app_password = "dashboard"
