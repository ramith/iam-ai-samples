# Compose topology for the Identity-First AI Agent Governance POC (v4).
# Fully-local deployment: WSO2 IS + MySQL run as containers (no remote AWS VM).
#
# Infra tier:
#   - mysql         : WSO2 IS backing store (named volume mysql-data)
#   - wso2is        : WSO2 Identity Server 7.3.0 (alias wso2is; provisioned by
#                     scripts/provision-is.py). IS posts back-channel-logout
#                     in-network to http://orchestrator:8080/backchannel-logout.
# App tier (Sprint 4):
#   - orchestrator  : SPA host + chat router + CIBA fan-out + reports proxy + BCL receiver (http://localhost:8090)
#   - hr_agent      : HR specialist; per-agent CIBA → hr_server MCP tools
#   - it_agent      : IT specialist; per-agent CIBA → it_server MCP tools
#   - hr_server     : HR MCP tools + REST (leave, cubicles, reports)
#   - it_server     : IT MCP tools + REST (assets, reports)
#
# First-time bring-up (see docs/architecture/fully-local-setup-plan.md):
#   ./scripts/local-setup.sh                 # fetch JDBC driver + WSO2 schema (once)
#   echo "127.0.0.1 wso2is" | sudo tee -a /etc/hosts   # browser → IS (once)
#   docker compose up -d mysql wso2is        # infra
#   python3 scripts/provision-is.py          # configure IS + write the 5 .env files
#   docker compose up -d --build             # app fleet
#
# All IS client-ids/secrets, agent ids/secrets, the inbound audiences, and the
# shared revocation secret come from the per-service .env files written by
# scripts/provision-is.py — NOT hard-coded here.

networks:
  demo-net:
    driver: bridge

volumes:
  mysql-data:   # WSO2 IS backing store; survives restarts, lost only on explicit removal

services:
  # ─── Infra tier (fully-local) ───────────────────────────────────────────────
  # WSO2 IS + its MySQL backing store, run locally instead of the remote AWS VM.
  # See docs/architecture/fully-local-setup-plan.md. Run scripts/local-setup.sh
  # ONCE before the first `up` to populate infra/wso2is/lib + infra/mysql/initdb.
  mysql:
    image: mysql:8.0
    # latin1 server default — WSO2 IS dbscripts size indexes for a 1-byte charset
    # (see infra/mysql/initdb/00-create-databases.sql). utf8mb4 overflows the
    # InnoDB 3072-byte key limit on wide composite indexes.
    command: ["--character-set-server=latin1", "--collation-server=latin1_swedish_ci"]
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql-data:/var/lib/mysql
      # 00-create-databases.sql (repo) + 10..40-*.sql (generated by local-setup.sh)
      - ./infra/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - demo-net

  wso2is:
    # Released GA image, used as-is. Config (deployment.toml) + JDBC driver are
    # injected via read-only mounts; schema is loaded by MySQL initdb (above).
    image: wso2/wso2is:7.3.0
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9443:9443"   # browser reaches https://wso2is:9443 via /etc/hosts → 127.0.0.1
    volumes:
      - ./infra/wso2is/deployment.toml:/home/wso2carbon/wso2is-7.3.0/repository/conf/deployment.toml:ro
      - ./infra/wso2is/lib/mysql-connector-j-8.4.0.jar:/home/wso2carbon/wso2is-7.3.0/repository/components/lib/mysql-connector-j-8.4.0.jar:ro
    healthcheck:
      # Coarse readiness (TCP 9443 open). True readiness is gated by the
      # provisioner polling the health API. bash ships in the ubuntu-based image.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9443"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks:
      demo-net:
        aliases:
          - wso2is

  # ─── App tier ───────────────────────────────────────────────────────────────
  hr_server:
    build:
      context: .
      dockerfile: hr_server/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # BLOCK-D: bind loopback only
    env_file:
      - ./hr_server/.env
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      - HR_SERVER_HOST=0.0.0.0
      - MCP_ALLOWED_HOSTS="127.0.0.1,localhost,hr_server"
      # Token introspection feature-flagged OFF (denylist-only backstop).
      # config.py reads HR_SERVER_INTROSPECT_ENABLED (default "true").
      - HR_SERVER_INTROSPECT_ENABLED=${HR_SERVER_INTROSPECT_ENABLED:-false}
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wso2is:
        condition: service_healthy
    networks:
      - demo-net

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      # Container listens on 8080 internally; host 8090 is the user-facing SPA.
      # IS posts back-channel-logout in-network to orchestrator:8080 (no tunnel).
      - "8090:8080"
    env_file:
      - ./orchestrator/.env
    environment:
      - ORCHESTRATOR_HOST=0.0.0.0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      - AGENT_CARDS_DIR=/app/agent_cards
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HR_AGENT_URL=http://hr_agent:8001
      - IT_AGENT_URL=http://it_agent:8002
      - HR_SERVER_URL=http://hr_server:8000
      - IT_SERVER_URL=http://it_server:8004
      # Must be EXACTLY a registered Callback URL on orchestrator-mcp-client.
      - POST_LOGOUT_REDIRECT_URI=${POST_LOGOUT_REDIRECT_URI:-http://localhost:8090/}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # POC constraint: single replica only (per milestone-plan §5.3 + R7 determinism).
    deploy:
      replicas: 1
    depends_on:
      wso2is:
        condition: service_healthy
      hr_agent:
        condition: service_healthy
      it_agent:
        condition: service_healthy
    networks:
      - demo-net

  hr_agent:
    build:
      context: .
      dockerfile: hr_agent/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"  # BLOCK-D: bind loopback only; receiver not on host LAN
    env_file:
      - ./hr_agent/.env
    environment:
      - HR_AGENT_HOST=0.0.0.0
      - HR_MCP_SERVER_URL=http://hr_server:8000
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wso2is:
        condition: service_healthy
      hr_server:
        condition: service_healthy
    networks:
      - demo-net

  it_agent:
    build:
      context: .
      dockerfile: it_agent/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"  # BLOCK-D: bind loopback only
    env_file:
      - ./it_agent/.env
    environment:
      - IT_AGENT_HOST=0.0.0.0
      - IT_MCP_SERVER_URL=http://it_server:8004
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wso2is:
        condition: service_healthy
      it_server:
        condition: service_healthy
    networks:
      - demo-net

  it_server:
    build:
      context: .
      dockerfile: it_server/Dockerfile
    ports:
      - "127.0.0.1:8004:8004"  # BLOCK-D: bind loopback only
    env_file:
      - ./it_server/.env
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      - IT_SERVER_HOST=0.0.0.0
      - MCP_ALLOWED_HOSTS="127.0.0.1,localhost,it_server"
      # Token introspection feature-flagged OFF (denylist-only backstop).
      # config.py reads IT_SERVER_INTROSPECT_ENABLED (default "true").
      - IT_SERVER_INTROSPECT_ENABLED=${IT_SERVER_INTROSPECT_ENABLED:-false}
      - UVICORN_WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wso2is:
        condition: service_healthy
    networks:
      - demo-net
